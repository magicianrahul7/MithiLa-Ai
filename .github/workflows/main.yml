name: Build MITHILA AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q MITHILA_AI_Android_Project.zip -d source
          echo "sdk.dir=$ANDROID_HOME" > source/local.properties

      - name: Build APK
        working-directory: source
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore
          else
            gradle assembleDebug -Pkotlin.jvm.target.validation.mode=ignore
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MITHILA-AI-APK
          path: source/**/build/outputs/apk/debug/*.apk
          retention-days: 14
          
          
